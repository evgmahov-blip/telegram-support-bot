name: Temporary runtime drain patch

on:
  push:
    branches:
      - feat/runtime-drain-webhook-reliability

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-drain-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-drain-webhook-reliability
      - name: Patch analytics queue drain
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/db.ts';
          let s = fs.readFileSync(path, 'utf8');
          const needle = `function enqueueEventAppend<T>(fn: () => Promise<T>): Promise<T> {\n  const run = eventTail.then(fn, fn);\n  eventTail = run.catch(() => {});\n  return run;\n}\n`;
          const replacement = `${needle}\n/** Wait until the serialized analytics event queue is fully settled. */\nexport async function drainAnalyticsEvents(): Promise<void> {\n  while (true) {\n    const tail = eventTail;\n    await tail;\n    if (tail === eventTail) return;\n  }\n}\n`;
          if (!s.includes('export async function drainAnalyticsEvents')) {
            if (!s.includes(needle)) throw new Error('enqueueEventAppend anchor not found');
            s = s.replace(needle, replacement);
            fs.writeFileSync(path, s);
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "reliability: expose analytics event drain [runtime-drain-patched]"
          git push
