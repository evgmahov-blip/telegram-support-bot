name: Apply Claude review fixes v3

on:
  push:
    branches:
      - feat/immutable-history-events

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Reuse v2 patch script
        run: |
          python <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/claude-review-fixes-v2.yml').read_text()
          marker = "      - name: Apply review fixes\n        run: |\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n      - name: Check legacy event names", start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-review-fixes.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-review-fixes.sh

      - name: Update legacy tests for dotted events and event model
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('test/features-commands.test.ts')
          text = p.read_text().replace("'ticket_closed'", "'ticket.closed'")
          p.write_text(text)

          p = Path('test/db.test.ts')
          text = p.read_text()
          marker = "const mockCreate = jest.fn();\n"
          if marker not in text:
              raise SystemExit('db.test.ts mock marker missing')
          text = text.replace(marker, marker + "const mockEventSave = jest.fn().mockResolvedValue(undefined);\nconst mockEventFindOne = jest.fn(() => query({ seq: 0 }));\n", 1)

          marker = "  const counterModel = {\n    findOneAndUpdate: mockCounterFindOneAndUpdate,\n  };\n"
          if marker not in text:
              raise SystemExit('db.test.ts counter marker missing')
          analytics = """

          const analyticsEventModel: any = jest.fn(function (this: any, data: any) {
            Object.assign(this, data);
            this.save = mockEventSave;
          });
          analyticsEventModel.findOne = mockEventFindOne;
          analyticsEventModel.find = jest.fn();
          analyticsEventModel.updateOne = jest.fn().mockResolvedValue({ modifiedCount: 1 });
          """
          text = text.replace(marker, marker + analytics, 1)

          marker = "      if (name === 'TicketCounter') return counterModel;\n      if (name === 'UserBan') return userBanModel;\n"
          if marker not in text:
              raise SystemExit('db.test.ts model marker missing')
          text = text.replace(marker, "      if (name === 'TicketCounter') return counterModel;\n      if (name === 'AnalyticsEvent') return analyticsEventModel;\n      if (name === 'UserBan') return userBanModel;\n", 1)
          p.write_text(text)
          PY

      - name: Check legacy event names
        run: |
          if grep -R -n -E "'(ticket_created|ticket_closed|ticket_escalated|staff_reply|first_reply)'" src; then
            echo 'Legacy analytics event names remain.'
            exit 1
          fi

      - name: Install and verify
        run: |
          npm ci
          npm run build
          npm test

      - name: Commit fixes
        run: |
          rm -f .github/workflows/claude-review-fixes.yml .github/workflows/claude-review-fixes-v2.yml .github/workflows/claude-review-fixes-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address event replay review"
          git push origin HEAD:feat/immutable-history-events
