name: MOST Core CI

on:
  push:
    branches:
      - most-core
  pull_request:
    branches:
      - most-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rbac-docker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout acceptance candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact PR 51 source
        uses: actions/checkout@v4
        with:
          ref: e48f6e5a520d9d04af4a4a36f4684e1794274ca1
          path: integrated
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact PR 52 package
        uses: actions/checkout@v4
        with:
          ref: c4add43d45c34c1c74c9ae8b7b0a952b9ae15e8d
          path: package
          fetch-depth: 0
          persist-credentials: false
      - name: Bind evidence to candidate head
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C candidate status --porcelain --untracked-files=all)"
          git -C candidate merge-base --is-ancestor d7da31bc182b71136a6b884200e02bdfd343fe23 HEAD
      - name: Verify provenance and materialize one-use integrated tree
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash candidate/acceptance/rbac-docker/prepare.sh "$GITHUB_WORKSPACE/integrated" "$GITHUB_WORKSPACE/package" "$GITHUB_WORKSPACE/evidence"
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify integrated project
        working-directory: integrated
        run: |
          node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
          npm ci
          npm run build
          npm test
      - name: Verify host checker dependency isolation
        env:
          NODE_PATH: ${{ github.workspace }}/integrated/node_modules
        run: |
          test ! -e evidence/build-input/node_modules
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const {createRequire} = require('node:module');
          assert.equal(process.versions.node.split('.')[0], '24');
          const checker = createRequire(path.resolve('evidence/build-input/deploy/vm3902/check-runtime.cjs'));
          assert.ok(checker.resolve('yaml').startsWith(path.resolve('integrated/node_modules') + path.sep));
          checker('./check-runtime.cjs');
          NODE
      - name: Verify acceptance failure evidence
        run: python3 -B candidate/acceptance/rbac-docker/test_runner.py
      - name: Real isolated Docker Compose acceptance
        # Host checker resolves lockfile dependencies from the verified checkout,
        # never from the clean archived Docker build context.
        run: sudo --preserve-env=GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_REPOSITORY env NODE24_BIN="$(command -v node)" NODE_PATH="$GITHUB_WORKSPACE/integrated/node_modules" python3 candidate/acceptance/rbac-docker/run.py "$GITHUB_WORKSPACE/evidence/build-input" "$GITHUB_WORKSPACE/evidence"
      - name: Upload synthetic acceptance and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbac-docker-acceptance-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/provenance.json
            evidence/apply.txt
            evidence/result.json
          if-no-files-found: warn
          retention-days: 3
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Unit tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: most-core-ci-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 3

  configuration-node24:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Configuration checks need no native addons or image build.
      - run: npm ci --ignore-scripts
      - name: Validate deployment configuration and preserved regressions
        run: npm test -- test/vm3902-packaging.test.ts test/logger-readonly.test.ts

  docker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Separate checkout; never consumes node_modules/build/config from other jobs.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and run exact candidate in Docker
        run: node scripts/docker-validation.cjs "$(git rev-parse HEAD)" "$RUNNER_TEMP/docker-validation"
      - name: Upload SHA-bound Docker result and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-validation-${{ github.sha }}
          path: ${{ runner.temp }}/docker-validation/
          if-no-files-found: error
          retention-days: 7
