name: MOST Core CI

on:
  push:
    branches:
      - most-core
  pull_request:
    branches:
      - most-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Unit tests
        if: always()
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: most-core-ci-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 3
