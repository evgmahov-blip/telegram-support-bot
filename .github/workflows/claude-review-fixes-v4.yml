name: Persist Claude review fixes

on:
  push:
    branches:
      - feat/immutable-history-events

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply verified v3 changes
        run: |
          python <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/claude-review-fixes-v3.yml').read_text()

          def extract(name, next_name):
              marker = f"      - name: {name}\n        run: |\n"
              start = text.index(marker) + len(marker)
              end = text.index(f"\n      - name: {next_name}", start)
              block = text[start:end]
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'

          Path('/tmp/reuse.sh').write_text(extract('Reuse v2 patch script', 'Update legacy tests for dotted events and event model'))
          Path('/tmp/tests.sh').write_text(extract('Update legacy tests for dotted events and event model', 'Check legacy event names'))
          PY
          bash /tmp/reuse.sh
          bash /tmp/tests.sh

      - name: Verify
        run: |
          if grep -R -n -E "'(ticket_created|ticket_closed|ticket_escalated|staff_reply|first_reply)'" src; then
            exit 1
          fi
          npm ci
          npm run build
          npm test

      - name: Commit non-workflow changes
        run: |
          git restore --source=HEAD -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address event replay review"
          git push origin HEAD:feat/immutable-history-events
