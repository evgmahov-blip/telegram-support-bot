name: Apply follow-up review fixes

on:
  push:
    branches:
      - feat/immutable-history-events

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply review fixes
        run: |
          cat > /tmp/fix.py <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: missing marker {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_section(path, start, end, new):
              p = Path(path)
              text = p.read_text()
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f'{path}: missing start {start!r}')
              j = text.find(end, i)
              if j < 0:
                  raise SystemExit(f'{path}: missing end {end!r}')
              p.write_text(text[:i] + new + text[j:])

          def lines(items):
              return '\n'.join(items) + '\n'

          replace_once(
              'src/db.ts',
              '  await backfillLegacyEvents();\n  return connection;',
              "  try {\n    await backfillLegacyEvents();\n  } catch (err) {\n    log.error('Legacy event backfill failed; replay may have gaps:', err);\n  }\n  return connection;",
          )

          db_event_section = lines([
              'const MAX_EVENT_APPEND_RETRIES = 25;',
              'const LEGACY_EVENT_BATCH_SIZE = 1000;',
              "const LEGACY_EVENT_BACKFILL_MARKER = 'legacyEventBackfillV2';",
              'const LEGACY_EVENT_TYPES: Record<string, string> = {',
              "  ticket_created: 'ticket.created',",
              "  ticket_closed: 'ticket.closed',",
              "  ticket_escalated: 'ticket.escalated',",
              "  staff_reply: 'ticket.replied',",
              "  first_reply: 'ticket.replied',",
              "  internal_note: 'ticket.note_added',",
              '};',
              'const LEGACY_EVENT_TYPE_NAMES = Object.keys(LEGACY_EVENT_TYPES);',
              '',
              'function isDuplicateSequenceError(err: unknown): boolean {',
              '  const mongoError = err as { code?: number; keyPattern?: Record<string, number> };',
              '  return mongoError?.code === 11000 && Boolean(mongoError.keyPattern?.seq);',
              '}',
              '',
              'async function waitForEventRetry(attempt: number): Promise<void> {',
              '  const delayMs = Math.min(50, 2 + attempt * 2) + Math.floor(Math.random() * 5);',
              '  await new Promise((resolve) => setTimeout(resolve, delayMs));',
              '}',
              '',
              'async function nextEventSequenceCandidate(): Promise<number> {',
              '  const latest = await AnalyticsEvent.findOne({ seq: { $exists: true } })',
              '    .sort({ seq: -1 })',
              "    .select('seq');",
              '  return (latest?.seq ?? 0) + 1;',
              '}',
              '',
              '/**',
              ' * One-shot migration for analytics rows created before the replay log.',
              ' * A completion marker keeps normal startup O(1); rows are processed in',
              ' * bounded batches and canonicalized to the dotted event taxonomy.',
              ' */',
              'export async function backfillLegacyEvents(): Promise<number> {',
              '  const markerId = `${getCollectionName()}:${LEGACY_EVENT_BACKFILL_MARKER}`;',
              "  const marker = await TicketCounter.findOne({ _id: markerId }).select('seq');",
              '  if (marker?.seq === 1) return 0;',
              '',
              '  let migrated = 0;',
              '  let collisionAttempt = 0;',
              '',
              '  while (true) {',
              '    const legacyEvents = await AnalyticsEvent.find({',
              '      $or: [',
              '        { seq: { $exists: false } },',
              '        { seq: null },',
              '        { event_id: { $exists: false } },',
              '        { event_id: null },',
              '        { type: { $in: LEGACY_EVENT_TYPE_NAMES } },',
              '      ],',
              '    })',
              '      .sort({ timestamp: 1, _id: 1 })',
              '      .limit(LEGACY_EVENT_BATCH_SIZE);',
              '',
              '    if (legacyEvents.length === 0) break;',
              '',
              '    const latest = await AnalyticsEvent.findOne({ seq: { $exists: true } })',
              '      .sort({ seq: -1 })',
              "      .select('seq');",
              '    let nextSeq = latest?.seq ?? 0;',
              '',
              '    const operations = legacyEvents.map((event) => {',
              '      const updates: Record<string, unknown> = {};',
              '      if (!event.event_id) updates.event_id = randomUUID();',
              '      if (!Number.isSafeInteger(event.seq)) {',
              '        nextSeq += 1;',
              '        updates.seq = nextSeq;',
              '      }',
              '      const renamedType = LEGACY_EVENT_TYPES[event.type];',
              '      if (renamedType) updates.type = renamedType;',
              '',
              '      return {',
              '        updateOne: {',
              '          filter: { _id: event._id },',
              '          update: { $set: updates },',
              '        },',
              '      };',
              '    });',
              '',
              '    try {',
              '      const result = await AnalyticsEvent.bulkWrite(operations, { ordered: true });',
              '      migrated += result.modifiedCount ?? operations.length;',
              '      collisionAttempt = 0;',
              '    } catch (err) {',
              '      if ((err as { code?: number })?.code === 11000 && collisionAttempt < MAX_EVENT_APPEND_RETRIES) {',
              '        await waitForEventRetry(collisionAttempt);',
              '        collisionAttempt += 1;',
              '        continue;',
              '      }',
              '      throw err;',
              '    }',
              '  }',
              '',
              '  await TicketCounter.findOneAndUpdate(',
              '    { _id: markerId },',
              '    { $set: { seq: 1 } },',
              '    { upsert: true, new: true, setDefaultsOnInsert: true },',
              '  );',
              '',
              '  if (migrated > 0) log.info(`Backfilled ${migrated} legacy analytics events.`);',
              '  return migrated;',
              '}',
              '',
              'function recordAnalyticsEventBestEffort(',
              '  type: string,',
              '  ticketId: number,',
              '  agent_id: string | null = null,',
              '  metadata: Record<string, any> = {},',
              '): void {',
              '  void recordAnalyticsEvent(type, ticketId, agent_id, metadata).catch((err) => {',
              '    log.error(`Event append failed for ${type} #T${ticketId}:`, err);',
              '  });',
              '}',
              '',
          ])
          replace_section('src/db.ts', 'const MAX_EVENT_APPEND_RETRIES = 8;', 'const allowedStatusSources', db_event_section)

          replace_once(
              'src/db.ts',
              "  await recordAnalyticsEvent('ticket.created', ticketId, null, { user_id: String(userid) });",
              "  recordAnalyticsEventBestEffort('ticket.created', ticketId, null, { user_id: String(userid) });",
          )
          replace_once(
              'src/db.ts',
              '  // The message and event are separate documents, but event loss must be\n  // observable instead of silently hidden after history was persisted.\n  await recordAnalyticsEvent(`ticket.message.${sender}`, ticketId, sender_id || null);',
              '  // History persistence is authoritative here; the mirrored event is best-effort.\n  recordAnalyticsEventBestEffort(`ticket.message.${sender}`, ticketId, sender_id || null);',
          )
          replace_once(
              'src/db.ts',
              '      if (isDuplicateSequenceError(err)) continue;',
              '      if (isDuplicateSequenceError(err)) {\n        await waitForEventRetry(attempt);\n        continue;\n      }',
          )

          # User delivery before message/event bookkeeping.
          replace_once(
              'src/users.ts',
              "  await db.addTicketMessage(ticket.ticketId, 'user', ctx.from.id.toString(), ctx.message.text);\n\n",
              '',
          )
          replace_once(
              'src/users.ts',
              '  if (messageId) {\n    db.addIdAndName(ticket.ticketId, messageId, ctx.message.from.first_name);\n  }\n\n  // Category groups remain internal staff surfaces.',
              "  if (messageId) {\n    db.addIdAndName(ticket.ticketId, messageId, ctx.message.from.first_name);\n  }\n\n  await db.addTicketMessage(ticket.ticketId, 'user', ctx.from.id.toString(), ctx.message.text);\n\n  // Category groups remain internal staff surfaces.",
          )

          p = Path('src/users.ts')
          text = p.read_text()
          start = text.find("    await db.addTicketMessage(ticket.ticketId, 'user', ctx.from.id.toString(), ctx.message.text);", text.find('} else if (sentCount < config.spam_cant_msg)'))
          end_marker = '    if (ctx.session.group && ctx.session.group !== config.staffchat_id) {'
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('src/users.ts: repeated-message delivery block not found')
          replacement = lines([
              '    const messageId = await sendMessage(',
              '      config.staffchat_id,',
              '      config.staffchat_type,',
              '      formatMessageAsTicket(',
              '        ticket.ticketId,',
              '        ctx,',
              '        autoReplyInfo,',
              '      ),',
              '    );',
              '    if (messageId) {',
              '      db.addIdAndName(ticket.ticketId, messageId, ctx.message.from.first_name);',
              '    }',
              '',
              "    await db.addTicketMessage(ticket.ticketId, 'user', ctx.from.id.toString(), ctx.message.text);",
              '',
          ])
          p.write_text(text[:start] + replacement + text[end:])

          # Staff delivery before SLA/history bookkeeping.
          replace_once(
              'src/staff.ts',
              "  if (!ticket.first_response_at) {\n    await db.setFirstResponseAt(ticketId);\n  }\n\n  await db.addTicketMessage(ticketId, 'staff', senderId, staffMessage);\n\n",
              '',
          )
          replace_once(
              'src/staff.ts',
              "      log.error('Web reply delivery failed', e);\n    }\n  } else {",
              "      log.error('Web reply delivery failed', e);\n      return;\n    }\n  } else {",
          )
          replace_once(
              'src/staff.ts',
              '    middleware.sendMessage(ticket.userid, ticket.messenger, replyContent).catch(log.error);\n  }\n\n  middleware.sendMessage(',
              "    await middleware.sendMessage(ticket.userid, ticket.messenger, replyContent);\n  }\n\n  if (!ticket.first_response_at) {\n    await db.setFirstResponseAt(ticketId);\n  }\n  await db.addTicketMessage(ticketId, 'staff', senderId, staffMessage);\n\n  middleware.sendMessage(",
          )

          replace_once(
              'docs/EVENTS.md',
              'Existing analytics rows from deployments before the sequenced event log are backfilled on startup. They receive UUID event IDs and sequence numbers; if a deployment already contains sequenced rows, older unsequenced rows are appended after the current maximum so an existing cursor is never rewound.',
              'Existing analytics rows from deployments before the sequenced event log are backfilled on startup in bounded batches. They receive UUID event IDs and sequence numbers, and legacy underscore event names are normalized to the canonical dotted taxonomy. If a deployment already contains sequenced rows, older unsequenced rows are appended after the current maximum so an existing cursor is never rewound. A completion marker makes subsequent startups skip the collection scan; migration failure is logged and does not prevent the bot from starting.',
          )

          # Focused regression coverage for best-effort mirror + legacy normalization.
          p = Path('test/db-history-events.test.ts')
          text = p.read_text()
          text = text.replace('const mockCounterFindOneAndUpdate = jest.fn();\n', 'const mockCounterFindOneAndUpdate = jest.fn();\nconst mockCounterFindOne = jest.fn();\n', 1)
          text = text.replace('const mockEventUpdateOne = jest.fn().mockResolvedValue({ modifiedCount: 1 });\n', 'const mockEventUpdateOne = jest.fn().mockResolvedValue({ modifiedCount: 1 });\nconst mockEventBulkWrite = jest.fn().mockResolvedValue({ modifiedCount: 1 });\n', 1)
          text = text.replace('AnalyticsEventModel.updateOne = mockEventUpdateOne;\n', 'AnalyticsEventModel.updateOne = mockEventUpdateOne;\nAnalyticsEventModel.bulkWrite = mockEventBulkWrite;\n', 1)
          text = text.replace("if (name === 'TicketCounter') return { findOneAndUpdate: mockCounterFindOneAndUpdate };", "if (name === 'TicketCounter') return { findOne: mockCounterFindOne, findOneAndUpdate: mockCounterFindOneAndUpdate };", 1)
          text = text.replace("    await db.addTicketMessage(7, 'user', '123', 'hello');\n    expect(TicketMessageModel)", "    await db.addTicketMessage(7, 'user', '123', 'hello');\n    await new Promise((resolve) => setImmediate(resolve));\n    expect(TicketMessageModel)", 1)

          insert = lines([
              '',
              "  it('does not reject persisted history when the mirrored event append fails', async () => {",
              "    mockEventSave.mockRejectedValueOnce(new Error('event unavailable'));",
              "    await expect(db.addTicketMessage(7, 'user', '123', 'hello')).resolves.toBeUndefined();",
              '    await new Promise((resolve) => setImmediate(resolve));',
              '    expect(mockMessageSave).toHaveBeenCalledTimes(1);',
              '  });',
              '',
              "  it('backfills legacy ids, sequences, and event names in bounded batches', async () => {",
              '    const markerQuery: any = {};',
              '    markerQuery.select = jest.fn().mockResolvedValue(null);',
              '    mockCounterFindOne.mockReturnValue(markerQuery);',
              '    mockEventFindOne.mockImplementation(() => latestSeq(7));',
              '',
              '    const firstBatch: any = {};',
              '    firstBatch.sort = jest.fn(() => firstBatch);',
              '    firstBatch.limit = jest.fn().mockResolvedValue([',
              "      { _id: 'legacy-1', event_id: undefined, seq: undefined, type: 'ticket_created' },",
              '    ]);',
              '    const emptyBatch: any = {};',
              '    emptyBatch.sort = jest.fn(() => emptyBatch);',
              '    emptyBatch.limit = jest.fn().mockResolvedValue([]);',
              '    mockEventFind.mockReturnValueOnce(firstBatch).mockReturnValueOnce(emptyBatch);',
              '',
              '    const migrated = await db.backfillLegacyEvents();',
              '',
              '    expect(migrated).toBe(1);',
              '    expect(firstBatch.limit).toHaveBeenCalledWith(1000);',
              '    expect(mockEventBulkWrite).toHaveBeenCalledWith([',
              '      {',
              '        updateOne: {',
              "          filter: { _id: 'legacy-1' },",
              '          update: {',
              '            $set: expect.objectContaining({',
              '              event_id: expect.stringMatching(/^[0-9a-f-]{36}$/i),',
              '              seq: 8,',
              "              type: 'ticket.created',",
              '            }),',
              '          },',
              '        },',
              '      },',
              '    ], { ordered: true });',
              '    expect(mockCounterFindOneAndUpdate).toHaveBeenCalledWith(',
              "      expect.objectContaining({ _id: expect.stringContaining('legacyEventBackfillV2') }),",
              '      { $set: { seq: 1 } },',
              '      { upsert: true, new: true, setDefaultsOnInsert: true },',
              '    );',
              '  });',
              '',
          ])
          marker = "  it('stops replay at the first sequence hole', async () => {"
          if marker not in text:
              raise SystemExit('test/db-history-events.test.ts: insertion marker missing')
          text = text.replace(marker, insert + marker, 1)
          p.write_text(text)
          PY
          python /tmp/fix.py

      - name: Verify build and tests
        run: |
          npm ci
          npm run build
          npm test

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test docs
          git diff --cached --check
          git commit -m "fix: make event audit non-blocking and migrate legacy types"
          git push origin HEAD:feat/immutable-history-events
