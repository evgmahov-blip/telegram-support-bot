services:
  supportbot:
    build: .
    restart: unless-stopped
    volumes:
      - ./config:/bot/config
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/support
      - MONGO_COLLECTION=most_support_tickets
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - ./.tmp/mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongodb_data:
